name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish src/Cut.csproj -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o publish

      # ffmpeg + ffprobe from BtbN (same source rewind uses)
      - name: Fetch ffmpeg
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-tmp
          Copy-Item ffmpeg-tmp/*/bin/ffmpeg.exe, ffmpeg-tmp/*/bin/ffprobe.exe publish/

      # libmpv pinned exactly so an upstream change is never the mystery variable in a failed test
      - name: Fetch libmpv
        run: |
          Invoke-WebRequest https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z -OutFile libmpv.7z
          7z x libmpv.7z -olibmpv-tmp
          Copy-Item (Get-ChildItem libmpv-tmp -Recurse -Filter libmpv-2.dll | Select-Object -First 1).FullName publish/

      # headless smoke test: libmpv loads, ffmpeg works, both export modes produce correct output
      - name: Selftest
        timeout-minutes: 10
        run: |
          $exe = (Resolve-Path publish/cut.exe).Path
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Selftest log
        if: always()
        run: |
          $log = "$env:LOCALAPPDATA/cut/logs/selftest.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no selftest log" }

      - name: Version
        id: v
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v','' } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer/cut.iss /DAppVersion=${{ steps.v.outputs.version }}

      - name: Portable zip
        run: Compress-Archive -Path publish/* -DestinationPath cut-${{ steps.v.outputs.version }}-win-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cut-win-x64
          path: |
            installer/Output/cut-setup-*.exe
            cut-*-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/cut-setup-*.exe
            cut-*-portable.zip
          generate_release_notes: true
